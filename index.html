<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arshu's Treasure Hunt 💎</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#05050a;
  color:#f5e8c8;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}

/* cinematic background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 15%,rgba(210,160,70,.14),transparent 32%),
    radial-gradient(circle at 20% 85%,rgba(120,50,100,.12),transparent 30%);
  z-index:-2;
}

.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:#d9b96b;
  border-radius:50%;
  opacity:.6;
  animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(.7)}
  50%{opacity:.8;transform:scale(1.3)}
}

#musicBtn{
  position:fixed;
  top:14px;
  right:14px;
  z-index:50;
  border:1px solid #9b7435;
  background:rgba(10,8,12,.8);
  color:#e8c978;
  border-radius:30px;
  padding:9px 14px;
  font-size:13px;
}

#progress{
  position:fixed;
  top:17px;
  left:15px;
  z-index:50;
  color:#caa65a;
  font-size:12px;
  letter-spacing:1px;
}

#game{
  min-height:100vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:65px 18px 30px;
}

.card{
  width:min(720px,100%);
  min-height:550px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 20px;
  border:1px solid rgba(180,140,65,.65);
  border-radius:28px;
  background:rgba(9,8,13,.93);
  box-shadow:
    0 0 80px rgba(0,0,0,.9),
    inset 0 0 45px rgba(180,130,50,.035);
  animation:enter .8s ease;
}

@keyframes enter{
  from{opacity:0;transform:translateY(22px) scale(.98)}
  to{opacity:1;transform:none}
}

.content{
  width:100%;
  text-align:center;
}

h1{
  margin:5px 0 12px;
  color:#e5c36f;
  font-size:clamp(34px,9vw,62px);
  line-height:1;
  letter-spacing:2px;
}

h2{
  color:#e2bd65;
  font-size:clamp(27px,7vw,42px);
  margin:10px 0 18px;
}

p{
  font-size:18px;
  line-height:1.7;
}

.gold{
  color:#e3c16f;
}

.muted{
  opacity:.58;
  font-size:14px;
}

.icon{
  font-size:65px;
  margin-bottom:8px;
  animation:float 2.5s ease-in-out infinite;
}

@keyframes float{
  50%{transform:translateY(-9px)}
}

button{
  border:1px solid #a27b3b;
  background:linear-gradient(180deg,#21190e,#100d09);
  color:#f3d995;
  padding:14px 24px;
  border-radius:30px;
  font-family:Georgia,serif;
  font-size:16px;
  margin:8px;
  cursor:pointer;
  transition:.25s;
}

button:active{
  transform:scale(.96);
}

button:hover{
  background:#2a200f;
  box-shadow:0 0 18px rgba(210,170,80,.12);
}

.bigBtn{
  margin-top:15px;
  padding:16px 32px;
  font-size:17px;
}

input{
  width:min(530px,92%);
  padding:15px 18px;
  border-radius:15px;
  border:1px solid #80602f;
  outline:none;
  background:#09080d;
  color:#fff4d9;
  font-family:Georgia,serif;
  text-align:center;
  font-size:18px;
  margin:10px auto;
}

input:focus{
  border-color:#d2ad5b;
  box-shadow:0 0 15px rgba(210,170,80,.12);
}

.choice{
  display:block;
  width:min(560px,95%);
  margin:12px auto;
}

.message{
  min-height:30px;
  margin-top:12px;
  font-size:16px;
}

.good{
  color:#e5c675;
}

.bad{
  color:#d98989;
}

.divider{
  width:80%;
  height:1px;
  margin:25px auto;
  background:linear-gradient(90deg,transparent,#85632f,transparent);
}

/* map */
.map{
  width:min(550px,95%);
  margin:20px auto;
  padding:25px;
  border:1px solid #76582c;
  border-radius:18px;
  background:#111016;
}

.path{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
}

.node{
  width:38px;
  height:38px;
  border:1px solid #8f6a32;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#caa85b;
  font-size:13px;
}

.line{
  flex:1;
  height:1px;
  background:#73552b;
}

/* chest */
.chest{
  font-size:110px;
  animation:chest 1.5s ease-in-out infinite;
}

@keyframes chest{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-8px) rotate(-2deg)}
}

/* letter */
.letterWrap{
  perspective:1000px;
}

.letter{
  background:
    linear-gradient(135deg,#dfc894,#c5aa70);
  color:#302313;
  padding:34px 25px;
  border-radius:7px;
  text-align:left;
  box-shadow:0 25px 70px #000;
  animation:unfold 1.1s ease;
  transform-origin:top;
}

@keyframes unfold{
  from{
    transform:rotateX(-90deg);
    opacity:0;
  }
  to{
    transform:rotateX(0);
    opacity:1;
  }
}

.letter h2{
  text-align:center;
  color:#3a2917;
}

.letter p{
  font-size:18px;
}

.signature{
  text-align:right;
  font-style:italic;
}

.coin{
  text-align:center;
  font-size:78px;
  animation:coin 2s infinite ease-in-out;
}

@keyframes coin{
  50%{transform:translateY(-10px) rotateY(180deg)}
}

/* romantic final */
.final{
  background:
    radial-gradient(circle at 50% 20%,rgba(180,70,110,.22),transparent 35%),
    radial-gradient(circle at 50% 80%,rgba(90,45,100,.18),transparent 40%);
}

.heart{
  font-size:65px;
  animation:heartbeat 1.4s infinite;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  20%{transform:scale(1.12)}
  40%{transform:scale(1)}
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<audio id="music" src="tera_naam_doon.mp3" loop preload="auto"></audio>

<button id="musicBtn" onclick="toggleMusic()">🔊 Music</button>
<div id="progress"></div>

<div id="game">
  <div class="card">
    <div class="content" id="content"></div>
  </div>
</div>

<script>

/* =========================
   BASIC SETUP
========================= */

const content = document.getElementById("content");
const music = document.getElementById("music");
const progress = document.getElementById("progress");

let level = 0;


/* =========================
   STARS
========================= */

for(let i=0;i<55;i++){
  const star=document.createElement("div");
  star.className="star";
  star.style.left=Math.random()*100+"%";
  star.style.top=Math.random()*100+"%";
  star.style.animationDelay=Math.random()*3+"s";
  document.getElementById("stars").appendChild(star);
}


/* =========================
   MUSIC
========================= */

function startMusic(){
  music.play().then(()=>{
    document.getElementById("musicBtn").innerText="🔊 Music";
  }).catch(()=>{
    document.getElementById("musicBtn").innerText="🎵 Tap Music";
  });
}

function toggleMusic(){
  if(music.paused){
    music.play();
    document.getElementById("musicBtn").innerText="🔊 Music";
  }else{
    music.pause();
    document.getElementById("musicBtn").innerText="🔇 Music";
  }
}


/* =========================
   HELPERS
========================= */

function normal(text){
  return text
    .toLowerCase()
    .replace(/[^\w\s]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function setProgress(){
  if(level===0){
    progress.innerText="";
  }else if(level<=7){
    progress.innerText="CHAABI "+level+" / 7";
  }else{
    progress.innerText="TREASURE FOUND 💎";
  }
}

function wrong(id="msg"){
  const el=document.getElementById(id);
  if(el){
    el.innerHTML='<span class="bad">Areee bbyyy 😭😂 phir se soch!</span>';
  }
}

function correct(){
  const el=document.getElementById("msg");
  if(el){
    el.innerHTML='<span class="good">🔓 LOCK KHUL GAYA! 🗝️🥹</span>';
  }

  setTimeout(()=>{
    level++;
    showLevel();
  },900);
}


/* =========================
   START SCREEN
========================= */

function startGame(){

  startMusic();

  level=0;

  content.innerHTML=`

    <div class="icon">🏴‍☠️</div>

    <h1>ARSHU'S<br>TREASURE HUNT</h1>

    <p class="gold">
      20th Birthday Special 💎
    </p>

    <div class="divider"></div>

    <p>
      Welcome, treasure hunter... 👀
    </p>

    <p>
      Aaj ka mission simple hai:
      <br>
      <b>7 chaabiyan dhoondo.</b>
      <br>
      Puzzles solve karo.
      <br>
      Aur end tak pahunch ke...
      <br>
      <span class="gold">asli treasure unlock karo. 🥹</span>
    </p>

    <p class="muted">
      Har clue dhyaan se padhna.
      Galat answer pe mera bby phas jayega 😂
    </p>

    <button class="bigBtn" onclick="beginHunt()">
      🗝️ BEGIN THE HUNT
    </button>

  `;
}

function beginHunt(){
  level=1;
  showLevel();
}


/* =========================
   LEVELS
========================= */

function showLevel(){

  setProgress();

  content.innerHTML="";

  if(level===1) level1();
  if(level===2) level2();
  if(level===3) level3();
  if(level===4) level4();
  if(level===5) level5();
  if(level===6) level6();
  if(level===7) level7();
}


/* =========================
   LEVEL 1
========================= */

function level1(){

  content.innerHTML=`

    <div class="icon">🗝️</div>

    <h2>CHAABI #1</h2>

    <p>
      Chalo shuru karein...
      <br>
      sabse pehla clue humari
      <b>legendary beginning</b> se hai 😂
    </p>

    <p class="gold">
      Humne pehle kitne hours ke liye
      boyfriend-girlfriend banne ki acting ki thi? 👀
    </p>

    <input id="answer"
      type="text"
      inputmode="numeric"
      placeholder="Type your answer...">

    <br>

    <button onclick="check1()">
      UNLOCK 🔐
    </button>

    <div class="message" id="msg"></div>
  `;
}

function check1(){

  const a=normal(document.getElementById("answer").value);

  if(a==="24" || a==="24 hours" || a==="24 hour"){
    correct();
  }else{
    wrong();
  }
}


/* =========================
   LEVEL 2
========================= */

function level2(){

  content.innerHTML=`

    <div class="icon">🐶</div>

    <h2>CHAABI #2</h2>

    <p>
      Arre bbyyy...
      <br>
      itna toh yaad hoga 😂
    </p>

    <p>
      Pehle maine tujhe kya bulaya,
      aur tune uska female version
      mujhe kya diya? 😭
    </p>

    <p class="gold">
      Type both names.
    </p>

    <input id="answer"
      type="text"
      placeholder="kutta kuttii">

    <br>

    <button onclick="check2()">
      UNLOCK 🔐
    </button>

    <div class="message" id="msg"></div>
  `;
}

function check2(){

  const a=normal(document.getElementById("answer").value);

  if(a.includes("kutta") && a.includes("kuttii")){
    correct();
  }else{
    wrong();
  }
}


/* =========================
   LEVEL 3
========================= */

function level3(){

  content.innerHTML=`

    <div class="icon">😂</div>

    <h2>CHAABI #3</h2>

    <p>
      Ab aaya tera legendary
      <b>naam confusion</b> 😭
    </p>

    <p>
      Tu mera real name nahi jaanta tha,
      kyunki sab mujhe <b>Divu</b> bolte the
      aur ek common friend ka naam bhi
      similar tha.
    </p>

    <p class="gold">
      Bata actual full name kya tha?
    </p>

    <input id="answer"
      type="text"
      placeholder="Type the name...">

    <br>

    <button onclick="check3()">
      UNLOCK 🔐
    </button>

    <div class="message" id="msg"></div>
  `;
}

function check3(){

  const a=normal(document.getElementById("answer").value);

  if(a.includes("divyanshi")){
    correct();
  }else{
    wrong();
  }
}


/* =========================
   LEVEL 4
========================= */

function level4(){

  content.innerHTML=`

    <div class="icon">👀</div>

    <h2>CHAABI #4</h2>

    <p>
      Ohooo...
      <br>
      ab jealousy wala chapter 😂
    </p>

    <p>
      Woh fake ID kis ladki ke naam se thi?
      <br>
      <span class="muted">Haan haan, mujhe sab yaad hai. 😭</span>
    </p>

    <input id="answer"
      type="text"
      placeholder="Type the name...">

    <br>

    <button onclick="check4()">
      UNLOCK 🔐
    </button>

    <div class="message" id="msg"></div>
  `;
}

function check4(){

  const a=normal(document.getElementById("answer").value);

  if(a==="priyanshi"){
    correct();
  }else{
    wrong();
  }
}


/* =========================
   LEVEL 5
========================= */

function level5(){

  content.innerHTML=`

    <div class="icon">🕵🏻</div>

    <h2>WHO IS THIS IDIOT?</h2>

    <p>
      Chaar clues hain.
      <br>
      Dhyaan se padh...
    </p>

    <div class="map">

      <p>🍗 Biryani ka fan</p>
      <p>🐶 Kutta wala nickname</p>
      <p>⏰ 24-hour trial</p>
      <p>👀 Fake ID jealousy kaand</p>

    </div>

    <p class="gold">
      Ye banda kaun hai?
    </p>

    <input id="answer"
      type="text"
      placeholder="Type the name...">

    <br>

    <button onclick="check5()">
      SOLVE 🕵🏻
    </button>

    <div class="message" id="msg"></div>

  `;
}

function check5(){

  const a=normal(document.getElementById("answer").value);

  if(a.includes("arshu")){
    correct();
  }else{
    wrong();
  }
}


/* =========================
   LEVEL 6
========================= */

function level6(){

  content.innerHTML=`

    <div class="icon">📦</div>

    <h2>THE LOCKED PARCEL</h2>

    <p>
      Finally parcel mil gaya. 👀
      <br>
      Lekin obviously...
      <br>
      <span class="gold">locked hai. 😂</span>
    </p>

    <div class="divider"></div>

    <p class="gold">
      🔐 LOCK 1 — UNSCRAMBLE
    </p>

    <p>
      VERE • RFOE • VUDIR • SHA
    </p>

    <input id="answer"
      type="text"
      placeholder="Type the secret phrase...">

    <br>

    <button onclick="check6a()">
      OPEN LOCK 1
    </button>

    <div class="message" id="msg"></div>

    <div id="lock2" class="hidden"></div>
  `;
}

function check6a(){

  const a=normal(document.getElementById("answer").value)
    .replace(/\s/g,"");

  if(a==="arshudivuforever"){

    document.getElementById("msg").innerHTML=
      '<span class="good">🔓 LOCK 1 OPEN! 🗝️😭</span>';

    document.getElementById("lock2").classList.remove("hidden");

    document.getElementById("lock2").innerHTML=`

      <div class="divider"></div>

      <p class="gold">
        🔐 LOCK 2 — SAME WORD
      </p>

      <p>
        Oyee mera ________ 🫶🏻
        <br>
        Kya kar raha hai mera ________ 😂
        <br>
        Jaldi idhar aa ________ 😭
      </p>

      <p class="muted">
        Teeno jagah SAME word.
      </p>

      <input id="answer2"
        type="text"
        placeholder="Type the word...">

      <br>

      <button onclick="check6b()">
        OPEN LOCK 2
      </button>

      <div class="message" id="msg2"></div>

    `;

  }else{
    wrong();
  }
}

function check6b(){

  const a=normal(document.getElementById("answer2").value);

  if(a==="baccha" || a==="bachaa" || a==="bby"){
    level=7;
    showLevel();
  }else{
    document.getElementById("msg2").innerHTML=
      '<span class="bad">Nahi nahi 😭 same word teenon mein!</span>';
  }
}


/* =========================
   LEVEL 7 — FINAL QUESTION
========================= */

function level7(){

  content.innerHTML=`

    <div class="icon">🗝️</div>

    <h2>AAKHRI CHAABI</h2>

    <p>
      RUKKKO bbyyy 😭✋🏻
    </p>

    <p>
      Itni jaldi treasure chahiye?
      <br>
      Pehle <b>aakhri sawaal</b>.
    </p>

    <div class="divider"></div>

    <p class="gold">
      <b>
      Humari itni saari memories mein...
      <br><br>
      hum dono ki sabse favourite cheez kya hai? 🥹🫶🏻
      </b>
    </p>

    <input id="answer"
      type="text"
      placeholder="Type your answer...">

    <br>

    <button onclick="check7()">
      UNLOCK THE TREASURE 💎
    </button>

    <div class="message" id="msg"></div>

  `;
}

function check7(){

  const a=normal(document.getElementById("answer").value);

  if(
    a.includes("hum") ||
    a.includes("ek dusre") ||
    a.includes("each other") ||
    a.includes("one another")
  ){
    treasure();
  }else{
    wrong();
  }
}


/* =========================
   TREASURE CHEST
========================= */

function treasure(){

  level=8;
  setProgress();

  content.innerHTML=`

    <div class="chest">💎</div>

    <h1>TREASURE<br>FOUND</h1>

    <p>
      OYYYY BACCHAAA 😭🫶🏻
      <br>
      Tu sach mein yahan tak aa gaya!
    </p>

    <p class="gold">
      Saari chaabiyan collect ho gayi.
      <br>
      Ab asli treasure tera wait kar raha hai...
    </p>

    <button class="bigBtn" onclick="openLetter()">
      📜 TAP TO OPEN TREASURE
    </button>

  `;
}


/* =========================
   VINTAGE LETTER
========================= */

function openLetter(){

  document.body.classList.add("final");

  content.innerHTML=`

    <div class="letterWrap">

      <div class="letter">

        <p style="text-align:center;font-size:14px;">
          ✦ FOR MY CHEESE KI FACTORY 🧀 ✦
        </p>

        <h2>💌</h2>

        <p>
          Agar tu yahan tak aa hi gaya...
          <br>
          toh congratulations bbyyy. 🥹
        </p>

        <p>
          Tune clues solve kiye,
          chaabiyan dhoondi,
          aur finally treasure tak pahunch gaya.
        </p>

        <p style="text-align:center;font-size:24px;">
          <b>But...</b>
        </p>

        <p style="text-align:center;font-size:25px;">
          <b>
            Treasure hum nahi hain...
          </b>
        </p>

        <p style="text-align:center;font-size:31px;">
          <b>
            Sabse bada treasure TU hai. 🥹🫂❤️
          </b>
        </p>

        <div class="divider"
             style="background:linear-gradient(90deg,transparent,#76542c,transparent);">
        </div>

        <p>
          Mera budhhu raam,
          mera cutu,
          meri favourite cheese ki factory... 😂🧀
        </p>

        <p>
          Itni saari memories,
          itne saare kaand,
          itni saari hasi aur bakwaas ke beech...
        </p>

        <p style="text-align:center;font-size:22px;">
          <b>
            tu hi mera favourite hai. 🥹
          </b>
        </p>

        <p style="text-align:center;">
          Happy 20th Birthday, bbyyy. 🎂❤️
        </p>

        <p class="signature">
          — Teri Divu 🫶🏻
        </p>

        <div class="divider"></div>

        <div class="coin">🪙</div>

        <p style="text-align:center;">
          <b>
            20 years old.<br>
            Still my favourite idiot. 😂🫶🏻
          </b>
        </p>

      </div>

    </div>

  `;
}


/* =========================
   SHOW START SCREEN
========================= */

startGame();

</script>

</body>
</html>
